[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oryon-lending-protocol"
version = "1.0.0"
description = "Vyper lending market with collateral, variable debt, liquidations and per-asset limits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["vyper==0.4.3", "titanoboa==0.2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
